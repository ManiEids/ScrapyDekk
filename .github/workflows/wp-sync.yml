# Asks dekkjahusid.is to import the newest tire-feed asset. Dispatched by the
# home runner (home/run_feed.sh) after it uploads the feed; the secret stays in GitHub.
name: WordPress feed sync
on:
  workflow_dispatch: {}
env:
  WP_SITE: https://dekkjahusid.is
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger WordPress feed import
        run: |
          HTTP_CODE=000
          for WAIT in 0 120 300 600; do
            [ "$WAIT" -gt 0 ] && { echo "Retrying in ${WAIT}s..."; sleep "$WAIT"; }
            HTTP_CODE=$(curl -sS --max-time 120 -X POST \
              -H "X-DTS-Sync-Secret: ${{ secrets.DTS_SYNC_SECRET }}" \
              -o dts-sync-response.json -w "%{http_code}" \
              "$WP_SITE/wp-json/dts/v1/sync") || HTTP_CODE=000
            echo "HTTP $HTTP_CODE"; head -c 2000 dts-sync-response.json 2>/dev/null || true; echo
            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && exit 0
            [ "$HTTP_CODE" -ge 400 ] && [ "$HTTP_CODE" -lt 500 ] && break
          done
          echo "::error::WordPress sync failed with HTTP $HTTP_CODE"
          exit 1
