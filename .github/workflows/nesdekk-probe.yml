# Diagnostic only. Does not scrape, merge, publish, or touch WordPress.
# Answers one question: what can a GitHub runner reach on nesdekk.is, and is
# the 403 about the TLS fingerprint, the headers, or purely the runner IP?
name: Nesdekk access probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install "curl_cffi>=0.7"

      - name: Runner egress IP
        run: |
          set -e
          echo "Runner public IP / ASN:"
          curl -s --max-time 20 https://ipinfo.io/json || true
          echo ""

      - name: curl baselines
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          URL='https://nesdekk.is/dekkjaleit/?tyre-filter=1'

          echo "curl default UA          : $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL")"
          echo "curl Chrome UA (h2)      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" "$URL")"
          echo "curl Chrome UA (http1.1) : $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 --http1.1 -A "$UA" "$URL")"
          echo ""
          echo "Response headers for the blocked request:"
          curl -sI --max-time 25 -A "$UA" "$URL" | grep -iE 'http/|cf-ray|cf-mitigated|server|cf-cache' || true
          exit 0

      - name: Probe clients and paths
        run: |
          set -e
          python tools/nesdekk_probe.py

      - name: Run the real Nesdekk spider end to end
        run: |
          set +e
          pip install -r requirements.txt
          timeout 15m scrapy crawl nesdekk -O nesdekk.json \
            -s DOWNLOAD_TIMEOUT=60 \
            -s CONCURRENT_REQUESTS=4 \
            -s CONCURRENT_REQUESTS_PER_DOMAIN=2 \
            -s DOWNLOAD_DELAY=0.25 \
            -s AUTOTHROTTLE_ENABLED=True \
            -s AUTOTHROTTLE_START_DELAY=0.5 \
            -s AUTOTHROTTLE_MAX_DELAY=6 \
            -s AUTOTHROTTLE_TARGET_CONCURRENCY=1.5 > nesdekk.log 2>&1
          echo "spider exit: $?"

          echo "===== status codes and totals ====="
          grep -E "response_status_count|item_scraped_count|elapsed_time_seconds|retry/" nesdekk.log || true

          echo "===== any blocks? ====="
          grep -cE "403 Forbidden" nesdekk.log || true

          python - <<'PY2'
          import json
          from pathlib import Path

          p = Path("nesdekk.json")
          rows = json.loads(p.read_text(encoding="utf-8")) if p.exists() else []
          print(f"NESDEKK ROWS: {len(rows)}")
          if rows:
              print("sample:", json.dumps(rows[0], ensure_ascii=False)[:220])
              missing_price = sum(1 for r in rows if not r.get("price"))
              missing_sku = sum(1 for r in rows if not r.get("sku"))
              print(f"rows missing price: {missing_price} | missing sku: {missing_sku}")
          PY2
          exit 0

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesdekk-probe-results
          path: probe_results.json
          if-no-files-found: warn
