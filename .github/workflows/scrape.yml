# .github/workflows/scrape.yml
# Scrapes tire sources, merges them into combined_tire_data.json,
# publishes the JSON as a rolling GitHub Release asset,
# and directly triggers WordPress to import the newest feed.

name: Scrape tires & publish feed

on:
  schedule:
    # Once per day at 03:17 Iceland time / UTC
    - cron: '17 3 * * *'

  workflow_dispatch: {}

  push:
    branches: [ main ]
    paths:
      - 'Leita/**'
      - 'merge_tires.py'
      - 'carry_over.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write

concurrency:
  group: tire-scrape
  cancel-in-progress: false

env:
  WP_SITE: https://dekkjahusid.is
  # A blocked seller's rows are reused from the last published feed for
  # this many days before the run starts failing instead.
  MAX_STALE_DAYS: '3'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python files compile
        run: |
          set -e
          python -m py_compile merge_tires.py carry_over.py
          find Leita -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Run core tire spiders in parallel
        env:
          # Residential proxy used only for nesdekk.is, which returns 403 to
          # the runner's datacenter IP. Unset is tolerated: Nesdekk then
          # scrapes 0 rows and carry_over.py reuses the previous feed.
          NESDEKK_PROXY: ${{ secrets.NESDEKK_PROXY }}
        run: |
          set -e

          run_spider() {
            NAME="$1"
            OUT="$2"
            LOG="$3"
            shift 3

            echo "Starting $NAME..."
            timeout 15m scrapy crawl "$NAME" -O "$OUT" \
              -s DOWNLOAD_TIMEOUT=30 \
              -s CLOSESPIDER_TIMEOUT=840 \
              "$@" > "$LOG" 2>&1
          }

          run_spider klettur klettur.json klettur.log \
            -s CONCURRENT_REQUESTS=8 \
            -s CONCURRENT_REQUESTS_PER_DOMAIN=4 \
            -s DOWNLOAD_DELAY=0.1 \
            -s AUTOTHROTTLE_ENABLED=True \
            -s AUTOTHROTTLE_START_DELAY=0.2 \
            -s AUTOTHROTTLE_MAX_DELAY=4 \
            -s AUTOTHROTTLE_TARGET_CONCURRENCY=2.0 &
          PID_KLETTUR=$!

          run_spider mitra mitra.json mitra.log \
            -s CONCURRENT_REQUESTS=8 \
            -s CONCURRENT_REQUESTS_PER_DOMAIN=4 \
            -s DOWNLOAD_DELAY=0.1 \
            -s AUTOTHROTTLE_ENABLED=True \
            -s AUTOTHROTTLE_START_DELAY=0.2 \
            -s AUTOTHROTTLE_MAX_DELAY=4 \
            -s AUTOTHROTTLE_TARGET_CONCURRENCY=2.0 &
          PID_MITRA=$!

          # Only nesdekk.is needs the proxy, so scope the env vars to this
          # subshell rather than exporting them to Klettur and Mitra as well.
          # Scrapy's HttpProxyMiddleware picks http_proxy/https_proxy up on its
          # own; use a sticky-session endpoint so all ~180 listing pages come
          # from one IP and Cloudflare's clearance cookie stays valid.
          if [ -n "$NESDEKK_PROXY" ]; then
            echo "Nesdekk: routing through the configured residential proxy."
          else
            echo "::warning::NESDEKK_PROXY is not set. nesdekk.is returns 403 to datacenter IPs, so Nesdekk will scrape 0 rows and fall back to carried-over data."
          fi

          (
            export http_proxy="$NESDEKK_PROXY"
            export https_proxy="$NESDEKK_PROXY"
            run_spider nesdekk nesdekk.json nesdekk.log \
              -s DOWNLOAD_TIMEOUT=60 \
              -s CONCURRENT_REQUESTS=4 \
              -s CONCURRENT_REQUESTS_PER_DOMAIN=2 \
              -s DOWNLOAD_DELAY=0.25 \
              -s AUTOTHROTTLE_ENABLED=True \
              -s AUTOTHROTTLE_START_DELAY=0.5 \
              -s AUTOTHROTTLE_MAX_DELAY=6 \
              -s AUTOTHROTTLE_TARGET_CONCURRENCY=1.5
          ) &
          PID_NESDEKK=$!

          FAIL=0

          wait $PID_KLETTUR || FAIL=1
          wait $PID_MITRA || FAIL=1
          wait $PID_NESDEKK || FAIL=1

          echo "===== Klettur log tail ====="
          tail -n 120 klettur.log || true

          echo "===== Mitra log tail ====="
          tail -n 120 mitra.log || true

          echo "===== Nesdekk log tail ====="
          tail -n 120 nesdekk.log || true

          if [ "$FAIL" -ne 0 ]; then
            echo "::warning::At least one core spider exited non-zero or timed out. See the log tails above."
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          files = {
              "Klettur": "klettur.json",
              "Mitra": "mitra.json",
              "Nesdekk": "nesdekk.json",
          }

          counts = {}
          for name, path in files.items():
              target = Path(path)
              try:
                  data = json.loads(target.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"::warning::{name} produced no readable output ({exc})")
                  target.write_text("[]", encoding="utf-8")
                  data = []
              counts[name] = len(data)
              print(f"{name} raw: {len(data)}")

          empty = [name for name, count in counts.items() if count == 0]
          if len(empty) == len(files):
              raise SystemExit("Every core spider returned 0 rows - aborting before merge.")
          for name in empty:
              print(
                  f"::warning::{name} returned 0 rows; its previous data will be "
                  "carried over if it is recent enough."
              )
          PY

      - name: Run N1 Algolia spider optional
        run: |
          set +e

          timeout 12m scrapy crawl n1 -O n1.json \
            -s CONCURRENT_REQUESTS=4 \
            -s CONCURRENT_REQUESTS_PER_DOMAIN=4 \
            -s DOWNLOAD_DELAY=0.05 \
            -s AUTOTHROTTLE_ENABLED=True \
            -s AUTOTHROTTLE_START_DELAY=0.2 \
            -s AUTOTHROTTLE_MAX_DELAY=2 \
            -s AUTOTHROTTLE_TARGET_CONCURRENCY=2.0 \
            > n1.log 2>&1
          STATUS=$?

          echo "===== N1 log tail ====="
          tail -n 180 n1.log || true

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::N1 spider failed or timed out. Continuing with empty n1.json."
            echo "[]" > n1.json
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("n1.json")
          if not path.exists():
              print("N1 output missing; creating empty n1.json")
              path.write_text("[]", encoding="utf-8")
              raise SystemExit(0)

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"N1 output invalid JSON: {exc}; replacing with []")
              path.write_text("[]", encoding="utf-8")
              raise SystemExit(0)

          print(f"N1 raw: {len(data)}")
          if len(data) == 0:
              print("::warning::N1 returned 0 rows. Check the N1 log tail above.")
          PY

      - name: Fetch previously published feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release download tire-feed \
               --repo "$GITHUB_REPOSITORY" \
               --pattern combined_tire_data.json \
               --output previous_feed.json; then
            python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("previous_feed.json").read_text(encoding="utf-8"))
          print(f"Previous feed: {len(rows)} rows")
          PY
          else
            echo "::warning::No previous tire-feed asset to download; carry-over is unavailable this run."
            rm -f previous_feed.json
          fi

      - name: Merge tire data
        run: |
          set -e
          python merge_tires.py

      - name: Carry over previous data for blocked sellers
        run: |
          set -e
          python carry_over.py

      - name: Validate merged feed
        run: |
          set -e
          python - <<'PY'
          import json
          from collections import Counter

          with open("combined_tire_data.json", encoding="utf-8") as f:
              data = json.load(f)

          counts = Counter(item.get("seller") for item in data)
          stale = Counter(
              item.get("seller") for item in data if item.get("stale")
          )

          print("Merged total:", len(data))
          for seller in ["Klettur", "Mitra", "Nesdekk", "N1"]:
              carried = stale.get(seller, 0)
              note = f"  ({carried} carried over from a previous run)" if carried else ""
              print(f"{seller}: {counts.get(seller, 0)}{note}")

          missing_core = [
              seller for seller in ["Klettur", "Mitra", "Nesdekk"]
              if counts.get(seller, 0) == 0
          ]

          if missing_core:
              raise SystemExit(
                  "Refusing to publish. Missing core seller data: "
                  f"{', '.join(missing_core)}. Either that spider has been failing "
                  "for longer than MAX_STALE_DAYS or there was no previous feed to "
                  "carry over from."
              )

          if len(data) < 1000:
              raise SystemExit(f"Refusing to publish suspiciously small feed: {len(data)} rows")

          print("Feed validation passed.")
          PY

      - name: Publish feed as rolling Release asset
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: tire-feed
          name: Tire feed latest
          files: combined_tire_data.json
          fail_on_unmatched_files: true

      - name: Trigger WordPress feed import
        run: |
          set -e

          HTTP_CODE=$(curl -sS --max-time 120 \
            -X POST \
            -H "X-DTS-Sync-Secret: ${{ secrets.DTS_SYNC_SECRET }}" \
            -o dts-sync-response.json \
            -w "%{http_code}" \
            "$WP_SITE/wp-json/dts/v1/sync")

          echo "WordPress sync HTTP status: $HTTP_CODE"
          echo "WordPress sync response:"
          cat dts-sync-response.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::WordPress sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
